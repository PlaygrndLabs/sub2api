# Deploys the free-plan gateway in free/ when it changes on main. The build downloads the latest
# CPA dashboard. Set its DASHBOARD_PASSWORD once with
# `npx wrangler secret put DASHBOARD_PASSWORD` from free/.
name: deploy free

on:
  push:
    branches: [main]
    paths: ["free/**", ".github/workflows/deploy-free.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-free
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # The Cloudflare token goes only to the steps that call Cloudflare, never to npm install
    # scripts or the Claude Code check.
    steps:
      - name: Check Cloudflare credentials
        id: creds
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Skipping deploy: add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as repository secrets to deploy from GitHub Actions."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.creds.outputs.ready == 'true'
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - if: steps.creds.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: free/package-lock.json
      # Installed and deployed from free/, as the Deploy button does, so the build step finds its script.
      - if: steps.creds.outputs.ready == 'true'
        working-directory: free
        run: npm ci
      - name: Deploy
        id: deploy
        if: steps.creds.outputs.ready == 'true'
        working-directory: free
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Optional repository variables that freeze the dashboard; the build fails if the
          # download doesn't match PANEL_SHA256.
          PANEL_VERSION: ${{ vars.PANEL_VERSION }}
          PANEL_SHA256: ${{ vars.PANEL_SHA256 }}
        run: |
          npx wrangler deploy | tee deploy.log
          echo "url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)" >> "$GITHUB_OUTPUT"
      # Live check through the deployed gateway, using a gateway key stored as a repository
      # secret. Skipped until that secret exists. Nothing secret is printed. Claude Code is pinned
      # so a new npm release never runs here unreviewed.
      - name: Try Claude Code through the gateway
        if: steps.creds.outputs.ready == 'true'
        env:
          ANTHROPIC_BASE_URL: ${{ steps.deploy.outputs.url }}
          ANTHROPIC_API_KEY: ${{ secrets.SUB2API_FREE_TEST_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ] || [ -z "$ANTHROPIC_BASE_URL" ]; then
            echo "::notice::Skipping the live check: add a gateway API key as the SUB2API_FREE_TEST_KEY repository secret."
            exit 0
          fi
          echo "== GET /v1/models"
          curl -sS -o models.json -w "HTTP %{http_code}\n" "$ANTHROPIC_BASE_URL/v1/models" -H "x-api-key: $ANTHROPIC_API_KEY"
          head -c 400 models.json; echo
          echo "== Claude Code, one prompt"
          npx -y @anthropic-ai/claude-code@2.1.296 -p "Reply with exactly: gateway works" --output-format text 2>&1 | tail -20
          echo "== Claude Code, a longer streamed answer"
          npx -y @anthropic-ai/claude-code@2.1.296 -p "Count from 1 to 200, comma separated." --output-format text 2>&1 | tail -c 600
