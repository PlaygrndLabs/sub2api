# Deploys the free-plan gateway in free/ when it changes on main. Set its DASHBOARD_PASSWORD
# once with `npx wrangler secret put DASHBOARD_PASSWORD -c free/wrangler.jsonc`.
name: deploy free

on:
  push:
    branches: [main]
    paths: ["free/**", ".github/workflows/deploy-free.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-free
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check Cloudflare credentials
        id: creds
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Skipping deploy: add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as repository secrets to deploy from GitHub Actions."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.creds.outputs.ready == 'true'
        uses: actions/checkout@v4
      - if: steps.creds.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: steps.creds.outputs.ready == 'true'
        run: npm ci
      - name: Deploy
        id: deploy
        if: steps.creds.outputs.ready == 'true'
        run: |
          npx wrangler deploy -c free/wrangler.jsonc | tee deploy.log
          echo "url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)" >> "$GITHUB_OUTPUT"
      # Live check through the deployed gateway, using a gateway key stored as a repository
      # secret. Skipped until that secret exists. Nothing secret is printed.
      - name: Try Claude Code through the gateway
        if: steps.creds.outputs.ready == 'true'
        env:
          ANTHROPIC_BASE_URL: ${{ steps.deploy.outputs.url }}
          ANTHROPIC_API_KEY: ${{ secrets.SUB2API_FREE_TEST_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ] || [ -z "$ANTHROPIC_BASE_URL" ]; then
            echo "::notice::Skipping the live check: add a gateway API key as the SUB2API_FREE_TEST_KEY repository secret."
            exit 0
          fi
          echo "== GET /v1/models"
          curl -sS -o models.json -w "HTTP %{http_code}\n" "$ANTHROPIC_BASE_URL/v1/models" -H "x-api-key: $ANTHROPIC_API_KEY"
          head -c 400 models.json; echo
          echo "== Claude Code, one prompt"
          npx -y @anthropic-ai/claude-code -p "Reply with exactly: gateway works" --output-format text 2>&1 | tail -20
          echo "== Claude Code, a longer streamed answer"
          npx -y @anthropic-ai/claude-code -p "Count from 1 to 200, comma separated." --output-format text 2>&1 | tail -c 600
