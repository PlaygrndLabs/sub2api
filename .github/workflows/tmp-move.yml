# Temporary: runs the export step once from this branch (user approved 2026-11-01). Removed before merge.
name: tmp move export
on:
  push:
    branches: [claude/project-thread-5091oo]
    paths: [".github/workflows/tmp-move.yml"]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Export the Workers-only install into R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: sh scripts/move-to-container.sh
