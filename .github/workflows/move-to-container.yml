# Moves the Workers-only install to the Container install on the same account (Workers Paid plan),
# keeping logins, API keys and config. Run it by hand from the Actions tab, one step at a time:
#   export   copies everything into the sub2api R2 bucket, with a backup; changes nothing else
#   replace  exports again, then deletes the Workers-only Worker and deploys the Container install;
#            set DASHBOARD_PASSWORD and MANAGEMENT_KEY on the new Worker right after
#   check    signs in with the first gateway API key and tries models, GPT text, Claude and Realtime voice
# Logs show counts, status codes and model names only.
name: move to container

on:
  workflow_dispatch:
    inputs:
      step:
        description: Step to run
        type: choice
        options: [export, replace, check]
        default: export

permissions:
  contents: read

concurrency:
  group: deploy-container
  cancel-in-progress: false

jobs:
  move:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Export${{ inputs.step == 'replace' && ' and replace' || '' }}
        if: inputs.step != 'check'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STEP: ${{ inputs.step }}
        run: |
          if [ "$STEP" = replace ]; then sh scripts/move-to-container.sh --replace; else sh scripts/move-to-container.sh; fi
      - name: Check the gateway
        if: inputs.step == 'check'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          root=$(pwd)
          work=$(mktemp -d)
          config=$(cd "$work" && "$root/node_modules/.bin/wrangler" r2 object get sub2api/config/config.yaml --remote --pipe 2>/dev/null) \
            || { echo "No config/config.yaml in the sub2api bucket yet: has the Container install started?"; exit 1; }
          key=$(printf '%s' "$config" | node --input-type=module -e "import { parse } from 'yaml'; let t=''; for await (const c of process.stdin) t+=c; process.stdout.write(String(parse(t)?.access?.['api-keys']?.[0] ?? ''))")
          [ -n "$key" ] || { echo "The config has no gateway API key."; exit 1; }
          echo "::add-mask::$key"
          subdomain=$(node -e "fetch('https://api.cloudflare.com/client/v4/accounts/'+process.env.CLOUDFLARE_ACCOUNT_ID+'/workers/subdomain',{headers:{authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN}}).then(r=>r.json()).then(j=>process.stdout.write(j.result?.subdomain??''))")
          [ -n "$subdomain" ] || { echo "Could not read the account's workers.dev subdomain."; exit 1; }
          unset CLOUDFLARE_API_TOKEN
          SUB2API_URL="https://sub2api.$subdomain.workers.dev" SUB2API_KEY="$key" node scripts/check-gateway.mjs
